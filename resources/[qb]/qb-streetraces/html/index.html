<html>
    <header>
        <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet" />
        <link rel="stylesheet" href="index.css" />
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    </header>
    <body>
        <!-- Inline display:none so nothing paints before index.js:34 hides it
             (the race lights + LOADING boxes flashed during load-in). Inline on
             purpose: fadeIn() clears an inline none and the cascade restores
             display:grid — a stylesheet none would come back as block. -->
        <div id="UI" class="wrapper" style="display: none">
            <div class="container">
                <div id="light_1" class="light"></div>
                <div id="light_2" class="light"></div>
                <div id="light_3" class="light"></div>
                <div id="light_4" class="light"></div>
                <div id="light_5" class="light"></div>
            </div>
            <div class="container_info">
                <div id="INFO_RACERS" class="info">LOADING</div>
                <div id="INFO_PRIZEPOOL" class="info">LOADING</div>
            </div>
        </div>
    </body>
    <footer>
        <script src="index.js"></script>
    </footer>
</html>
